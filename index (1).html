/* --- Đăng nhập thành viên, quay thưởng sau mua hàng, quản lý thành viên --- */
let ME=ls.g('me',null);
function needLogin(cb){if(ME)return cb();window._cb=cb;box(`<h3>🔑 Đăng nhập để nhận xu</h3><p><small>Nhập họ tên và số điện thoại. Xu được lưu theo số điện thoại của bạn.</small></p><label>Họ tên</label><input id="ln"><label>Số điện thoại</label><input id="lp" type="tel"><p class="err" id="le"></p><button class="btn" onclick="doLogin()">Đăng nhập</button> <button class="btn o" onclick="cls()">Hủy</button>`)}
async function doLogin(){const name=$('#ln').value.trim(),phone=$('#lp').value.trim(),r=await call('member',{name,phone});if(!r.ok)return $('#le').textContent='Vui lòng nhập họ tên và số điện thoại đúng.';ME={name,phone};ls.s('me',ME);ls.s('xu',r.xu);if(r.codes)ls.s('mycodes',r.codes);hdr();cls();toast('Xin chào '+name+'!');const f=window._cb;window._cb=null;f&&f()}
function logout(){ME=null;ls.s('me',null);ls.s('xu',0);hdr();games()}
const PRZ=[{xu:10},{xu:20},{xu:30},{xu:50},{xu:100},{v:'XU100'},{v:'XUSHIP'},{xu:15}];
const lab=z=>z.xu?z.xu+' xu':z.v;
const wheelSVG=L=>{const n=L.length,R=100,P=k=>[R*Math.sin(k*2*Math.PI/n),-R*Math.cos(k*2*Math.PI/n)];return`<svg viewBox="-105 -105 210 210" class="d" id="wh">${L.map((t,k)=>{const a=P(k),b=P(k+1);return`<path d="M0 0L${a[0]} ${a[1]}A${R} ${R} 0 0 1 ${b[0]} ${b[1]}Z" fill="${k%2?'#f39c12':'#c0392b'}" stroke="#fff" stroke-width="1.5"/><text transform="rotate(${(k+.5)*360/n}) translate(0,-66)" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${esc(t)}</text>`}).join('')}</svg>`};
function wheel(L,w,done){box(`<h2 style="text-align:center">🎡 Vòng quay may mắn</h2><div class="wl">${wheelSVG(L)}</div><p id="wr" style="text-align:center">Đang quay...</p><p style="text-align:center"><button class="btn o" onclick="cls();location.hash=='#games'&&games()">Đóng</button></p>`);setTimeout(()=>{const e=$('#wh');if(e)e.style.transform=`rotate(${1800-(w+.5)*360/L.length}deg)`},60);setTimeout(done,4200)}
async function orderSpin(id){if(!ME)return needLogin(()=>orderSpin(id));const sp=ls.g('spun',[]);if(sp.includes(id))return toast('Đơn này đã quay rồi');let w=Math.random()*PRZ.length|0;
if(API){const r=await call('spin',{id,phone:ME.phone});if(!r.ok)return toast(r.err=='dup'?'Đơn này đã quay rồi':'Chưa quay được, thử lại sau nhé');w=r.k;ls.s('xu',r.xu);ls.s('mycodes',r.codes||[])}
sp.push(id);ls.s('spun',sp);const z=PRZ[w];
wheel(PRZ.map(lab),w,async()=>{if(!API){if(z.xu)await addXu(z.xu,'Quay thưởng đơn '+id);else{const my=ls.g('mycodes',[]);if(!my.includes(z.v)){my.push(z.v);ls.s('mycodes',my)}await call('xu',{...ME,n:0,why:'Trúng voucher '+z.v+' (đơn '+id+')'})}}hdr();const e=$('#wr');if(e)e.innerHTML=z.xu?`Bạn trúng <b>${z.xu} xu</b>! 🎉`:`Bạn trúng voucher <b>${z.v}</b>! Mã đã có trong giỏ hàng.`})}
async function memV(){const M=await call('members',{pw});window._M=Array.isArray(M)?M:[];$('#ad').innerHTML=`<p>Tổng thành viên: <b>${_M.length}</b></p><div style="overflow:auto"><table><tr><th>Tên</th><th>SĐT</th><th>Xu</th><th>Tham gia</th><th>Lần cuối</th><th></th></tr>${_M.sort((a,b)=>b.last-a.last).map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.phone)}</td><td>${m.xu}</td><td>${new Date(m.joined).toLocaleString('vi-VN')}</td><td>${new Date(m.last).toLocaleString('vi-VN')}</td><td><button class="btn o" onclick="memLog('${esc(m.phone)}')">Lịch sử</button></td></tr>`).join('')||'<tr><td colspan=6>Chưa có thành viên.</td></tr>'}</table></div>`}
function memLog(p){const m=_M.find(x=>x.phone==p);box(`<h3>Lịch sử xu: ${esc(m.name)} (${esc(m.phone)})</h3>${m.log.map(l=>`<div class="row"><small>${new Date(l.t).toLocaleString('vi-VN')}</small><span style="flex:1;padding:0 8px">${esc(l.why)}</span><b>${l.n>0?'+':''}${l.n}</b></div>`).join('')}<button class="btn o" onclick="cls()">Đóng</button>`)}
addEventListener('hashchange',route);save();route().then(ad);
